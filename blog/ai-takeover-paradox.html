<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog Title · Kunal Kava</title>
  <meta name="description" content="Blog article by Kunal Kava" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <div class="brand">Kunal Kava</div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/#projects">Projects</a>
      <a href="/blog/">Blog</a>
      <a href="/#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container blog-article">

      <!-- Article card -->
      <article class="article-card">

        <!-- Meta -->
        <div class="article-meta">
          <span class="pill">My Takes</span>
          <span class="muted">· Feb 2026</span>
        </div>

        <!-- Title -->
        <h1 class="article-title">
          Blog Title Goes Here
        </h1>

        <!-- Optional subtitle -->
        <p class="article-subtitle">
          Optional subtitle or one-line context goes here.
        </p>

        <hr class="divider" />

        <!-- ========================= -->
        <!-- ARTICLE CONTENT START -->
        <!-- ========================= -->

        <div class="article-content">
          <!-- 
            Paste your article HTML here.
            Example:
            <p>First paragraph...</p>
            <p>Second paragraph...</p>
            <h2>Section heading</h2>
            <p>More text...</p>
          -->
        </div>

        <!-- ========================= -->
        <!-- ARTICLE CONTENT END -->
        <!-- ========================= -->

      </article>

    </div>
  </section>
</main>

<footer class="footer">
  © <span id="year"></span> Kunal Kava
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
